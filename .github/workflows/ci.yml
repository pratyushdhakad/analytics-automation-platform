name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run automated tests
        run: make test
      - name: Rebuild committed evidence
        run: make run
      - name: Verify reproducible outputs
        run: git diff --exit-code
      - name: Validate dashboard JavaScript
        run: node --check site/app.js
